name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install Windows SQLCipher build prerequisite
        run: choco install strawberryperl --yes --no-progress
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend gates
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Browser-mode end-to-end gate
        run: npm run test:e2e
      - name: Real Gateway end-to-end gate
        run: npm run test:e2e:gateway
      - name: Rust gates
        run: cargo fmt --all --check && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings
      - name: Gateway source build check
        run: cargo build -p fin-alfred-gateway
      - name: One-command source installer gate
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-SourceInstaller.ps1
