name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"
      - name: Sync locked AKShare environment
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --project data-provider
      - name: Test AKShare adapter
        run: uv run --frozen --project data-provider python -m unittest discover -s data-provider -p "test_*.py" -v
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
