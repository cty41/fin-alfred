name: release-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install SQLCipher build prerequisite
        run: choco install strawberryperl --yes --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - run: cargo fmt --all --check && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm tauri build --bundles nsis
      - name: Install, launch, uninstall, and retain data
        shell: pwsh
        run: ./scripts/Test-WindowsPackage.ps1 -InstallerPath (Get-ChildItem 'target/release/bundle/nsis/Margin Safety_*.exe' | Select-Object -First 1).FullName
      - name: Generate SHA-256
        shell: pwsh
        run: Get-ChildItem 'target/release/bundle/nsis/Margin Safety_*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content target/release/bundle/nsis/SHA256SUMS.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: target/release/bundle/nsis/sbom.spdx.json
      - name: Generate third-party license inventories
        shell: pwsh
        run: |
          cargo install cargo-license --locked
          cargo license --json | Set-Content target/release/bundle/nsis/rust-licenses.json
          pnpm licenses list --json --prod | Set-Content target/release/bundle/nsis/frontend-licenses.json
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            target/release/bundle/nsis/Margin Safety_*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/sbom.spdx.json
            target/release/bundle/nsis/rust-licenses.json
            target/release/bundle/nsis/frontend-licenses.json
          body: |
            Windows NSIS preview. Code signing status: unsigned unless the artifact signature is separately verified.
            This is a draft and requires clean-machine installation, launch, uninstall, and data-retention acceptance.
