<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fin-alfred</title>
<style>
:root { --bg:#0f1117; --fg:#e2e4e9; --dim:#8b8fa3; --accent:#5b9cf5; --card:#181b23; --border:#2a2e3a; --green:#4ade80; --red:#f87171; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
header .sub { font-size: 12px; color: var(--dim); }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 760px; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #1e3a5f; border: 1px solid #2a5a8f; }
.msg.alfred { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
.msg.alfred.error { border-color: var(--red); }
table { border-collapse: collapse; margin-top: 8px; font-size: 12px; }
th, td { padding: 4px 10px; border: 1px solid var(--border); text-align: left; }
th { color: var(--dim); font-weight: 500; }
#input-row { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
#cmd-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: var(--fg); font: inherit; font-size: 13px; outline: none; }
#cmd-input:focus { border-color: var(--accent); }
#send-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-size: 13px; }
#send-btn:hover { opacity: 0.9; }
.hint { color: var(--dim); font-size: 12px; padding: 4px 20px; }
</style>
</head>
<body>
<header>
  <h1>fin-alfred</h1>
  <span class="sub">确定性价值投资助手 · 无 LLM · 输入 help 开始</span>
</header>
<div id="messages"></div>
<div class="hint">提示: help · watchlist list · position &lt;id&gt; · strategy status &lt;id&gt; · trade log ...</div>
<div id="input-row">
  <input id="cmd-input" type="text" placeholder="输入命令..." autocomplete="off" autofocus>
  <button id="send-btn">发送</button>
</div>
<script>
const API = location.origin;
let sessionId = null;
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("cmd-input");

function addMsg(role, text, table) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (table) {
    const t = document.createElement("table");
    const thead = t.createTHead(); const hr = thead.insertRow();
    table.headers.forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
    const tbody = t.createTBody();
    table.rows.forEach(r => { const tr = tbody.insertRow(); r.forEach(c => { const td = tr.insertCell(); td.textContent = c; }); });
    div.appendChild(t);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function init() {
  try {
    const res = await fetch(API + "/api/v1/sessions", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({ title: "web" }) });
    const data = await res.json();
    sessionId = data.id;
    addMsg("alfred", "fin-alfred 会话已建立。输入 help 查看命令，guide 查看引导。");
  } catch (e) {
    addMsg("alfred", "无法连接 gateway: " + e.message, null);
  }
}

async function send() {
  const cmd = inputEl.value.trim();
  if (!cmd) return;
  inputEl.value = "";
  addMsg("user", cmd);
  try {
    const res = await fetch(API + "/api/v1/chat", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({ input: cmd, sessionId }) });
    const result = await res.json();
    addMsg("alfred" + (result.ok ? "" : " error"), result.message, result.table);
  } catch (e) {
    addMsg("alfred error", "请求失败: " + e.message);
  }
}

inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("send-btn").addEventListener("click", send);
init();
</script>
</body>
</html>
